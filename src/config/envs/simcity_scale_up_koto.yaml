env: simcity_scale_up_koto

env_args:
  key: "simcity_scale_up_koto"
  map_name: "simcity_scale_up_koto"
  seed: null
  time_limit: 100
  grid_x: 12
  grid_y: 12

# Koto experiment specific settings
common_reward: False  # Use individual rewards for player archetypes
test_greedy: True
test_nepisode: 20
test_interval: 5000
log_interval: 1000
runner_log_interval: 1000
learner_log_interval: 1000
t_max: 2000000
use_tensorboard: True
use_cuda: True
save_model: True
save_model_interval: 10000
batch_size_run: 16
batch_size: 128
buffer_size: 40000